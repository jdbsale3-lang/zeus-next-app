name: zeus-app-pipeline

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/**"]
  pull_request:
    branches: [main]
    paths: ["app/**"]

concurrency:
  group: app-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · typecheck · unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Typecheck + build
        run: bun run build
      - name: Unit tests
        run: bun test tests/*.test.ts
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeus-dist
          path: app/dist
          retention-days: 7

  smoke:
    name: live-site smoke (auth gate = alive)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check production auth gate
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://zeus-next-app.higgsfield.app/)
          echo "HTTP $code"
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "Auth gate responding — site is alive"
          elif [ "$code" = "200" ]; then
            echo "Public 200 — site is alive"
          else
            echo "Expected 200/401/403, got $code" >&2
            exit 1
          fi
