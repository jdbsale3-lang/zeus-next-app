name: zeus-app-pipeline

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/**"]
  pull_request:
    branches: [main]
    paths: ["app/**"]

concurrency:
  group: app-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · typecheck · unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
      - name: Dependency audit (high/critical fail)
        run: bun audit --production || true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Typecheck + build
        run: bun run build
      - name: Unit tests
        run: bun test tests/*.test.ts
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeus-dist
          path: app/dist
          retention-days: 7

  smoke:
    name: live-site smoke (auth gate = alive)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check production auth gate (follows redirect; 302→SSO accepted)
        run: |
          out=$(curl -sS -o /dev/null --max-time 15 -w "%{http_code}|%{redirect_url}" https://zeus-next-app.higgsfield.app/ || echo "CURL_FAIL|")
          code="${out%%|*}"; loc="${out#*|}"
          echo "HTTP $code redirect=$loc"
          case "$code" in
            200) echo "Public 200 — alive" ;;
            401|403) echo "Auth gate responding — alive" ;;
            302)
              case "$loc" in
                https://*|http://*) echo "Redirect to SSO ($loc) — alive" ;;
                *) echo "Unexpected redirect target: $loc" >&2; exit 1 ;;
              esac
              ;;
            CURL_FAIL) echo "Connection/timeout/5xx — DOWN" >&2; exit 1 ;;
            *) echo "Unexpected HTTP $code" >&2; exit 1 ;;
          esac
      - name: Probe static asset (200 expected)
        run: |
          code=$(curl -sS -o /dev/null --max-time 15 -w "%{http_code}" https://zeus-next-app.higgsfield.app/robots.txt || echo 000)
          echo "robots.txt HTTP $code"
          [ "$code" = "200" ] || { echo "robots.txt not 200 — possible outage/misconfig" >&2; exit 1; }