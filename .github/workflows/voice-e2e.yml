name: ZEUS voice E2E — Chromium · Firefox · WebKit

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  voice-e2e:
    name: ${{ matrix.engine }} — voice E2E
    runs-on: ubuntu-latest
    # Official Playwright image: browsers + system deps preinstalled,
    # including WebKit's WPE automation stack (not available in local
    # sandboxes without root — see app/tests/e2e/README.md §3c).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: app
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The Playwright image ships no `unzip`, and oven-sh/setup-bun needs it
      # to extract the bun binary (bun-version pinned to the lockfile's).
      - name: Install unzip for bun setup
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Voice E2E — DEV SANDBOX mock on ${{ matrix.engine }}
        # The suite boots the Vite dev server itself in VITE_ZEUS_MOCK=1
        # sandbox mode (playwright.config.ts webServer); this project runs
        # one engine per matrix leg. On firefox/webkit the harness removes
        # native SpeechRecognition so the real MediaRecorder fallback path
        # is exercised.
        run: bun run test:e2e -- --project=${{ matrix.engine }}
        env:
          CI: "1"

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voice-e2e-${{ matrix.engine }}-traces
          path: app/test-results/
          retention-days: 7