name: ZEUS voice E2E — Chromium · Firefox · WebKit

on:
  push:
    paths:
      - "app/**"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:

jobs:
  voice-e2e:
    runs-on: ubuntu-latest
    # Official Playwright image: all three browsers + system deps preinstalled
    # (WebKit's WPE automation stack included — no LD_LIBRARY_PATH gymnastics).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: app
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Voice E2E — DEV SANDBOX mock on all browsers
        # The suite boots the app itself (VITE_ZEUS_MOCK=1 webServer in
        # playwright.config.ts) and runs chromium, firefox and webkit projects.
        run: bun run test:e2e
        env:
          CI: "1"